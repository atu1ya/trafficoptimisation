services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      OSM_BBOX_SOUTH: ${OSM_BBOX_SOUTH:--32.120}
      OSM_BBOX_NORTH: ${OSM_BBOX_NORTH:--31.920}
      OSM_BBOX_WEST: ${OSM_BBOX_WEST:-115.740}
      OSM_BBOX_EAST: ${OSM_BBOX_EAST:-116.050}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - ./backend/data/networks:/app/backend/data/networks
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
